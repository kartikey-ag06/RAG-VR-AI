# coturn settings for VR_RAG expert calls
listening-port=3478
# the server's public IP (on AWS: the Elastic IP; behind NAT use  public/private)
external-ip=203.0.113.10
realm=vrrag.example.com
# shared secret: VR_RAG makes a login valid for 6 hours from it (TURN REST API)
use-auth-secret
static-auth-secret=change-me-to-a-long-random-string
# relay ports (open these UDP ports in the firewall)
min-port=49160
max-port=49200
fingerprint
no-cli
no-tlsv1
no-tlsv1_1
# never relay into private networks
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=stdout
