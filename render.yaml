services:
  - type: web
    name: vr-rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: GROQ_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: MCP_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
